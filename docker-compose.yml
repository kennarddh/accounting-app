name: accounting_app-local

services:
    database:
        image: postgres:18.6-alpine
        volumes:
            - database:/var/lib/postgresql
        environment:
            - POSTGRES_PASSWORD=root
            - POSTGRES_USER=root
            - POSTGRES_DB=accounting_app
        healthcheck:
            test: ["CMD-SHELL", "pg_isready -d $$POSTGRES_DB"]
            interval: 30s
            timeout: 20s
            start_period: 1s
            start_interval: 5s
            retries: 5
        networks:
            - app
        ports:
            - 5432:5432

    nginx:
        image: nginx:alpine
        volumes:
            - ./infrastructure/development/nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
        networks:
            - app
        ports:
            - 5000:80

volumes:
    database:

networks:
    app:
